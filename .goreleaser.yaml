version: 2

project_name: diablo-lazy-macro

builds:
  - id: diablolazymacro
    main: .
    binary: diablolazymacro
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -H windowsgui

archives:
  - formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksums:
  name_template: checksums.txt

changelog:
  use: github-native
